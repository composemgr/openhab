name: openhab
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  server:
    image: openhab/openhab:latest
    container_name: openhab-server
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: openhab-server
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      # openHAB runtime settings
      OPENHAB_HTTP_PORT: ${OPENHAB_HTTP_PORT:-8080}
      OPENHAB_HTTPS_PORT: ${OPENHAB_HTTPS_PORT:-8443}
      EXTRA_JAVA_OPTS: -Duser.timezone=${TZ:-America/New_York}
    healthcheck:
      test: ['CMD', '/bin/sh', '-c', 'curl -f http://localhost:$${OPENHAB_HTTP_PORT}/ || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - './volumes/config/openhab/addons:/openhab/addons'
      - './volumes/config/openhab/conf:/openhab/conf'
      - './volumes/data/openhab:/openhab/userdata'
    labels:
      - 'cloudflare.enable=true'
      - 'cloudflare.service=http://openhab-server:8080'
      - 'cloudflare.hostname=${BASE_HOST_NAME:-$HOSTNAME}'
    networks:
      - openhab
      - cloudflare

networks:
  openhab:
    name: openhab
    external: false
  cloudflare:
    external: true
